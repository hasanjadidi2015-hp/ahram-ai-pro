یگنال، ذخیره، داشبورد. نقطه ورود: python ahram_pro.py یا --test\n    ahram_pro_v5.py - موتور V5 آزمایشی با 5 موتور V2 + VACE + Sentiment\n    agent.py - رانر قدیمی\n    config.py - INS_CODE, DATABASE_NAME, آستانه‌ها\n\nجمع‌آوری داده\n\n    collector.py - قیمت لحظه‌ای سهم (last_price, closing_price, volume, trades)\n    option_collector.py - زنجیره آپشن‌ها از TSETMC\n    order_book.py - فیکس 08-31: عمق 5 ردیف سهم، dual fallback pMeDem/qTitMeDem/zOrdMeDem خرید و pMeOf|pMeArz / qTitMeOf|qTitMeArz / zOrdMeOf|zOrdMeArz فروش + هشدار اگر یک طرف صفر\n    option_order_book.py - عمق آپشن‌ها\n    index_feed.py - شاخص‌ها با timeout 20 ثانیه (جلوگیری از هنگ algotik)\n    money_flow.py - جریان پول حقیقی/حقوقی\n    daily_news.py +\n    news_impact.py - اخبار کدال/ناظر، دسته‌بندی و تاثیر 20 روزه\n    history_loader.py,\n    candle_builder.py - لود تاریخچه و ساخت کندل\n\nاستراتژی و اندیکاتورها (12 تایی)\n\n    strategy.py - فیکس 09-01: _in_quiet_period اول چک داخل بازار 9:00-12:30، بعد نزدیک باز/بسته (3 دقیقه). STALE PRICE اگر 6 تیک آخر تخت و صف نباشه -\u003e WATCH اجباری. لود ORDER BY id ASC برای rolling، امتیازدهی 12 اندیکاتور\n    ichimoku.py,\n    vwap.py,\n    price_action.py,\n    market_regime.py,\n    heikin_ashi.py,\n    multi_timeframe.py,\n    bollinger.py,\n    rsi.py,\n    fibonacci.py,\n    rsi_divergence.py,\n    ema.py,\n    macd.py,\n    adx.py - هر کدام strength 0-100 و سیگنال BULLISH/BEARISH/NEUTRAL\n    adx.py - اگر داده تخت (DUPLICATE) -\u003e ATR NaN -\u003e ADX 0.0 - باید قبلش STALE بگیره\n\nتحلیل آپشن\n\n    option_selector.py - انتخاب بهترین قرارداد ATM + نقدشونده\n    option_engine.py +\n    iv_engine_v2.py +\n    iv_rank.py - محاسبه IV و IV Rank (اکتشافی، نیاز به 10 روز)\n    gamma_exposure.py - دیواره گاما (56000 اهرم، 1454 وبملت، 2800 شستا) + بایاس CALL/PUT\n    advanced_greeks.py,\n    greek_engine_v2.py - Charm, Vanna, Volga - فقط اطلاعاتی\n    wiv.py - WIV درصد گرانی آپشن\n    fog_meter.py - نسبت IV به HV\n    tape_reader.py - خوانش تابلو 0-5\n    vol nup.py,\n    reset_news_orderbook.py - ساخت/تعمیر DB\n    shadow_strategy.py,\n    signal_generator.py,\n    option_decision.py - استراتژی سایه\n    collect_all_orderbooks.py - V2: بک‌آپ V5 + ادغام main-\u003eV5 بر اساس time+level + کالکت لایو 6 DB\n    check_order_book.py - دیباگ تابلو: تعداد ردیف، آخرین snapshot، TWO_SIDED imb%\n    test_all_fixes.py - تست order_book dual fallback + volume_ok + ml per-symbol + امتیاز\n    test_quiet_and_vace.py - تست QUIET 22:02/08:00 + ADX تخت + VACE history\n    backtest.py,\n    backtest_all.py - بک‌تست\n\nخروجی‌ها (ساخته شده توسط کد)\n\n    dashboard.html,\n    dashboard_v5.html,\n    options_dashboard_AHRAM.html, LIVE4.html, LIVE4_V5.html, LIVE5.html, VIP5.html\n    ahram_strategy_data.json,\n    ahram_strategy_data_v5.json,\n    ahram_shadow_report.json,\n    ahram_shadow_report_v5.json,\n    ahram_shadow_history.json\n\n4. منطق سیگنال - 7 چک\n\nدر\nahram_pro.py تابع generate_multi_layer_signal:\n\nPython\n\nchecks = {\n  technicals_ok: False init, True فقط BUY/SELL\n  volume_ok: False init (فیکس 08-31، قبلا True همیشه) True فقط اگر volume_analysis==BUY\n  option_ok: False init, True اگر قرارداد انتخاب شد\n  wiv_ok: False init, True اگر WIV \u003c=85%\n  fog_ok: False init, True اگر CLEAN/LIGHT\n  tape_ok: False init, True اگر passed\n  market_ok: False init, True اگر indices یا money_flow\n}\npassed = sum(checks)\ncheck_score = passed/7*100\nfinal_score = technical_score*0.6 + check_score*0.4\nBUY_CALL/PUT اگر passed\u003e=3 و final_score\u003e=45 و option موجود\n\nباگ‌های فیکس شده:\n\n    volume_ok همیشه True بود -\u003e 5.7 امتیاز الکی -\u003e الان False اولیه + False صریح SELL/NEUTRAL\n    confidence\u003e=40 قبلا volume_ok رو True می‌کرد - حذف شد\n\n5. باگ‌های اخیر و درس‌ها (باید از این به بعد خودم پیدا کنم)\n\n    order_book pMeOf (08-31): API فیلد pMeOf نه pMeArz -\u003e فروش 0 -\u003e صف خرید کاذب. فیکس dual fallback + هشدار اگر یک طرف صفر\n    volume_ok (08-31): True init بدون False path -\u003e همیشه پاس. فیکس Fals ook.py        # TWO_SIDED +54.7% / -8% / -98.3%\n\nتست فیکس‌ها:\n\nBash\n\npython test_all_fixes.py\npython test_quiet_and_vace.py\n\nداشبورد:\n\nBash\n\npython dashboard.py\npython dashboard_v5.py\npython connect_strategy_dashboard.py\npython connect_strategy_dashboard_v5.py\n# خروجی: dashboard.html, dashboard_v5.html, LIVE4.html, LIVE5.html\n\n8. وضعیت فعلی 2026-09-02\n\n    قیمت: اهرم 55,506، وبملت 1,519، شستا 2,880 (بازار منفی)\n    سیگنال امروز: 120 تا همه WATCH (بازار نزولی، RSI 16-28 افراطی)\n    پوزیشن باز: هیچی (دیروز ضهرم7062 +24.4% نیم‌فروخته بسته شد)\n    سلامت: ✅ چیز مشکوکی پیدا نشد\n    زنجیره: 76/78/52 آپشن\n    V5: VACE ADX 45.86/56.38/40.48 ATR×4.24/4.6/3.68 + Fear\u0026Greed 52.5/57/67\n    داشبورد: تاخیر 5 دقیقه‌ای چون cycle 300 ثانیه و EMA/MACD 1-2 ساعت عقب‌تر از تابلو زنده - چیپ فشار فروش زنده‌ست ولی امتیاز از تکنیکال تاخیری\n\n9. کارهای بعدی\n\n    کاهش cycle_seconds از 300 به 60 برای روزهای نوسانی یا فیلتر order_book به سیگنال\n    VACE Shadow چند روز تست با MTC واقعی\n    بک‌تست volume_ok فیکس روی 246 روز\n    adx.py WARN برای داده تخت + dashboard_v5 CSS\n\nبرای ادامه کار: از\nahram_pro.py شروع کن، سپس\nstrategy.py و\norder_book.py، بعد\ntest_all_fixes.py رو بزن. تمام منطق داخل همین فایل‌هاست.\n\nامضا: AHRAM AI PRO - 2026-09-02 - نامه کامل بدون تکرا\n```"])</script><script>self.__next_f.push([1,"35:T342a,"])</script><script>self.__next_f.push([1,"# AHRAM AI PRO - برای برنامه‌نویس جدید\nنسخه نهایی 2026-09-02 - شامل تمام فیکس‌های اخیر\n\nگیتهاب: https://github.com/hasanjadidi2015-hp/ahram-ai-pro.git\nکدها را از گیتهاب بخوان - اینجا فقط اسم فایل و وظیفه آمده\n\n## 1. پروژه چیست؟\n\nسیستم تصمیم‌یار معامله آپشن بورس ایران (TSETMC) - سیگنال می‌دهد، اردر نمی‌فرستد.\n\n3 نماد پایه:\n\n- اهرم (17914401175772326) - 76 آپشن فعال\n- وبملت (778253364357513) - 78 آپشن\n- شستا (2400322364771558) - 52 آپشن\n\nهر 5 دقیقه قیمت، عمق سفارش، زنجیره آپشن، شاخص‌ها (58 شاخص)، جریان پول حقیقی/حقوقی، اخبار کدال را می‌گیرد، 12 اندیکاتور تکنیکال + 7 چک چندلایه را حساب م ر قرارداد انتخاب شد\n  wiv_ok: False init, True اگر WIV \u003c=85%\n  fog_ok: False init, True اگر CLEAN/LIGHT\n  tape_ok: False init, True اگر passed\n  market_ok: False init, True اگر indices یا money_flow\n}\npassed = sum(checks)\ncheck_score = passed/7*100\nfinal_score = technical_score*0.6 + check_score*0.4\nBUY_CALL/PUT اگر passed\u003e=3 و final_score\u003e=45 و option موجود\n```\n\nباگ‌های فیکس شده:\n\n- volume_ok همیشه True بود -\u003e 5.7 امتیاز الکی -\u003e الان False اولیه + False صریح SELL/NEUTRAL\n- confidence\u003e=40 قبلا volume_ok رو True می‌کرد - حذف شد\n\n## 5. باگ‌های اخیر و درس‌ها (باید از این به بعد خودم پیدا کنم)\n\n- order_book pMeOf (08-31): API فیلد pMeOf نه pMeArz -\u003e فروش 0 -\u003e صف خرید کاذب. فیکس dual fallback + هشدار اگر یک طرف صفر\n- volume_ok (08-31): True init بدون False path -\u003e همیشه پاس. فیکس False init + False صریح\n- QUIET PERIOD (09-01): چک now \u003e 12:27 بدون سقف -\u003e 22:02 شب هم QUIET. فیکس اول چک داخل بازار 9:00-12:30\n- ADX 0.0 (09-01): داده تخت DUPLICATE -\u003e TR NaN -\u003e ADX 0.0 - رفتار مورد انتظار، باید STALE PRICE قبلش بگیره\n- VACE ADX history (09-01): تاریخچه با فرمول دستی ساده، فعلی با کلاس ADX واقعی -\u003e سیب با پرتقال. فیکس هر دو با کلاس واقعی روی پنجره 42، fallback 20\n- ml per-symbol (08-31): مدل مشترک بازنویسی می‌شد -\u003e جدا per DB\n\n## 6. قوانین و مقررات توسعه - به حافظه سپرده شده\n\n- NO ASSUMPTIONS: هر متغیر کجا WRITE (=) و کجا READ - grep هر دو. fallback ساکت ممنوع - باید WARN\n- DB: هرگز ahram_v2.db, webmellt.db, shasta.db delete/reset نشود - قبلش backup با timestamp\n- prices: آخرین قیمت ORDER BY id DESC، برای rolling تکنیکال ORDER BY id ASC OK\n- Shadow: فقط `ahram_shadow_report.json` - نباید signal/پوزیشن/اردر/DB اصلی رو تغییر بده\n- Max Pain/Greeks: فقط ذخیره/نمایش برای بک‌تست - نباید روی score/confidence اثر بذاره تا بک‌تست بشه\n- سررسید: ترکیبات Shadow فقط همان expiry\n- فروش لخت: ممنوع\n- بازار: پنج‌شنبه جمعه تعطیل، STALE PRICE خارج ساعت طبیعی است\n- فایل تحویلی: هر فایل با 124.0.0.0 Safari/537.36\"\n    ),\n    \"Accept\": \"application/json, text/plain, */*\",\n    \"Referer\": \"https://www.tsetmc.com/\",\n}\n\n\ndef fetch_closing_price(max_retries=3):\n    url = (\n        f\"https://cdn.tsetmc.com/api/\"\n        f\"ClosingPrice/GetClosingPriceInfo/\"\n        f\"{config.INS_CODE}\"\n    )\n    for attempt in range(1, max_retries + 1):\n        try:\n            response = requests.get(url, headers=HEADERS, timeout=10)\n        except requests.exceptions.RequestException as e:\n            print(\"CONNECTION ERROR:\", e)\n            time.sleep(2)\n            continue\n        if response.status_code != 200:\n            print(\"SERVER ERROR :\", response.status_code)\n            time.sleep(2)\n            continue\n        if not response.text or not response.text.strip():\n            print(f\"EMPTY RESPONSE (attempt {attempt}/{max_retries}) -\u003e RETRYING\")\n            time.sleep(2)\n            continue\n        try:\n            data = response.json()\n        except ValueError:\n            print(f\"INVALID JSON (attempt {attempt}/{max_retries}) -\u003e RETRYING\")\n            print(\"RAW RESPONSE:\", response.text[:200])\n            time.sleep(2)\n            continue\n        closing_info = data.get(\"closingPriceInfo\")\n        if not closing_info:\n            print(\"UNEXPECTED RESPONSE SHAPE:\", data)\n            return None\n        return closing_info\n    print(\"FAILED TO FETCH DATA AFTER\", max_retries, \"ATTEMPTS\")\n    return None\n\n\ndef collect():\n    data = fetch_closing_price()\n    if data is None:\n        return\n    try:\n        last_price = data[\"pDrCotVal\"]\n        closing_price = data[\"pClosing\"]\n        volume = data[\"qTotTran5J\"]\n        trades = data[\"zTotTran\"]\n    except KeyError as e:\n        print(\"MISSING FIELD IN RESPONSE:\", e)\n        return\n\n    conn = sqlite3.connect(config.DATABASE_NAME)\n    cursor = conn.cursor()\n    cursor.execute(\n        \"SELECT last_price, volume, trades FROM prices ORDER BY id DESC LIMIT 1\"\n    )\n    last = cursor.fetchone()\n    if last:\n        old_price, old_volume, old_trades = last\n        if old_price == last_price and old_volume == volume and old_trades == trades:\n            print(\"DUPLICATE DATA -\u003e SKIPPED\")\n            conn.close()\n            return\n    cursor.execute(\n        \"\"\"\n        INSERT INTO prices (time, last_price, closing_price, volume, trades)\n        VALUES (?,?,?,?,?)\n        \"\"\",\n        (datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\"),\n         last_price, closing_price, volume, trades)\n    )\n    conn.commit()\n    conn.close()\n\n    print(\"=\" * 40)\n    print(\"NEW DATA SAVED\")\n    print(\"=\" * 40)\n    print(\"PRICE  :\", last_price)\n    print(\"CLOSE  :\", closing_price)\n    print(\"VOLUME :\", volume)\n    print(\"TRADES :\", trades)\n\n\nif __name__ == \"__main__\":\n    collect()"])</script><script>self.__next_f.push([1,"3e:T1120,"])</script><script>self.__next_f.push([1," \n80 requirements.txt\n128 ..\n430 start.bat\n511 LESSONS.md\n519 .gitignore\n579 fix_db.py\n602 README.md\n658 multi_timeframe.py\n868 history_loader.py\n973 ema.py\n1019 desktop_notify.py\n1051 macd.py\n1353 candle_builder.py\n1400 config.py\n1651 database.py\n1696 adx.py\n1716 rsi.py\n1763 telegram_notify.py\n2143 reset_news_orderbook.py\n2158 fog_meter.py\n2441 symbols_setup.py\n2481 index_feed.py\n2635 create_v5_dbs.p\n2635 create_v5_dbs.py\n2813 symbols_utils.py\n2882 money_flow.py\n3103 collector.py\n3212 fix_v5_schema.py\n3316 option_order_book.py\n3563 queue_surge.py\n3808 advanced_greeks.py\n4066 market_regime.py\n4096 .\n4096 .git\n4456 cleanup.py\n4464 iv_rank.py\n4481 check_order_book.py\n4685 option_decision.py\n4852 bollinger.py\n5397 tape_reader.py\n5442 spread_strategy.py\n5483 price_action.py\n5578 collect_all_orderbooks.py\n6057 ml_adjust.py\n6066 vwap.py\n6476 news_impact.py\n6511 test_all_fixes.py\n6667 gamma_exposure.py\n6974 heiki زار منفی بود.\n\nاین نسخه هر دو نام را چک می‌کند:\n- خرید: pMeDem / qTitMeDem / zOrdMeDem\n- فروش: pMeOf / pMeArz / qTitMeOf / qTitMeArz / zOrdMeOf / zOrdMeArz\nبر اساس نگاشت رسمی pytse-client/common.py\n\"\"\"\n\nimport requests\nimport sqlite3\nimport time\nfrom datetime import datetime\n\nimport config\n\nHEADERS = {\n    \"User-Agent\": (\n        \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) \"\n        \"AppleWebKit/537.36 (KHTML, like Gecko) \"\n        \"Chrome/124.0.0.0 Safari/537.36\"\n    ),\n    \"Accept\": \"application/json, text/plain, */*\",\n    \"Referer\": \"https://www.tsetmc.com/\",\n}\n\n\ndef fetch_order_book(ins_code=None, max_retries=3):\n    ins_code = ins_code or config.INS_CODE\n    url = f\"https://cdn.tsetmc.com/api/BestLimits/{ins_code}\"\n    for attempt in range(1, max_retries + 1):\n        try:\n            response = requests.get(url, headers=HEADERS, timeout=10)\n        except requests.exceptions.RequestException as e:\n            print(\"ORDER-BOOK CONNECTION ERROR:\", e)\n            time.sleep(2)\n            continue\n        if response.status_code != 200:\n            print(\"ORDER-BOOK SERVER ERROR:\", response.status_code)\n            time.sleep(2)\n            continue\n        if not response.text or not response.text.strip():\n            print(f\"ORDER-BOOK EMPTY RESPONSE (attempt {attempt}/{max_retries}) -\u003e RETRYING\")\n            time.sleep(2)\n            continue\n        try:\n            data = response.json()\n        except ValueError:\n            print(\"ORDER-BOOK INVALID JSON:\", response.text[:300])\n            time.sleep(2)\n            continue\n        levels = data.get(\"bestLimitsInfo\") or data.get(\"bestLimits\") or data.get(\"bestLimitsData\")\n        if not levels:\n            # اگر ساختار متفاوت بود، کلیدها را چاپ کن تا دیباگ شود\n            print(\"ORDER-BOOK UNEXPECTED RESPONSE SHAPE -- کلیدها:\", list(data.keys()) if isinstance(data, dict) else type(data))\n            print(\"نمونه داده:\", str(data)[:500])\n            return None\n        return levels\n    print(\"ORDER-BOOK FAILED AFTER\", max_retries, \"ATTEMPTS\")\n    return None\n\n\ndef _ensure_table(cur):\n    cur.execute(\"\"\"\n        CREATE TABLE IF NOT EXISTS order_book (\n            id INTEGER PRIMARY KEY AUTOINCREMENT,\n            time TEXT,\n            level INTEGER,\n            buy_count INTEGER,\n            buy_volume REAL,\n            buy_price REAL,\n            sell_price REAL,\n            sell_volume REAL,\n            sell_count INTEGER\n        )\n    \"\"\")\n    cur.execute(\"PRAGMA table_info(order_book)\")\n    existing = {r[1] for r in cur.fetchall()}\n    required = {\n        \"time\": \"TEXT\", \"level\": \"INTEGER\", \"buy_count\": \"INTEGER\",\n        \"buy_volume\": \"REAL\", \"buy_price\": \"REAL\", \"sell_price\": \"REAL\",\n        \"sell_volume\": \"REAL\", \"sell_count\": \"INTEGER\",\n    }\n    for col, coltype in required.items():\n        if col not in existing:\n            try:\n                cur.execute(f\"ALTER TABLE order_book ADD COLUMN {col} {coltype}\")\n            except Exception as e:\n                print(f\"⚠️ ORDER-BOOK WARNING: نتونستم ستون '{col}' رو اضافه کنم: {e}\")\n\n\ndef _get_field(lv, *names):\n    for n in names:\n        if n in lv and lv[n] is not None:\n            try:\n                # بعضی API ها رشته برمی‌گردانند\n                return lv[n]\n            except Exception:\n                return lv[n]\n    return 0\n\n\ndef collect_order_book(db_path=None, ins_code=None):\n    \"\"\"عمق سفارش رو می‌گیره، توی دیتابیس ذخیره می‌کنه، و خلاصه تحلیلی برمی‌گردونه.\"\"\"\n    db_path = db_path or config.DATABASE_NAME\n    levels = fetch_order_book(ins_code=ins_code)\n    if not levels:\n        return None\n\n    rows = []\n    for lv in levels:\n        try:\n            # نگاشت درست بر اساس pytse-client:\n            # bid = pMeDem / qTitMeDem / zOrdMeDem\n            # ask = pMeOf / qTitMeOf / zOrdMeOf  (و همچنین pMeArz/qTitMeArz/zOrdMeArz به عنوان fallback)\n            level = int(_get_field(lv, \"number\", \"depth\", \"level\") or 0)\n            buy_cnt = int(float(_get_field(lv, \"zOrdMeDem\", \"buyOrderCount\", \"buy_count\") or 0))\n            buy_vol = float(_get_field(lv, \"qTitMeDem\", \"buyVolume\", \"buy_volume\") or 0)\n            buy_price = float(_get_field(lv, \"pMeDem\", \"buyPrice\", \"buy_price\") or 0)\n\n            sell_price = float(_get_field(lv, \"pMeOf\", \"pMeOf\", \"pMeArz\", \"pMeArz\", \"sellPrice\", \"sell_price\", \"ask\") or 0)\n            sell_vol = float(_get_field(lv, \"qTitMeOf\", \"qTitMeOf\", \"qTitMeArz\", \"qTitMeArz\", \"sellVolume\", \"sell_volume\", \"vol_ask\") or 0)\n            sell_cnt = int(float(_get_field(lv, \"zOrdMeOf\", \"zOrdMeOf\", \"zOrdMeArz\", \"zOrdMeArz\", \"sellOrderCount\", \"sell_count\", \"num_ask\") or 0))\n\n            # اگر هر دو قیمت صفر بود، احتمالاً فیلدها متفاوت است - یک بار کلیدها را چاپ کن\n            if buy_price == 0 and sell_price == 0 and len(rows) == 0:\n                print(\"⚠️ DEBUG اولین ردیف خام:\", lv)\n\n            rows.append((level, buy_cnt, buy_vol, buy_price, sell_price, sell_vol, sell_cnt))\n        except Exception as e:\n            print(f\"ORDER-BOOK ROW PARSE ERROR: {e} -- lv={lv}\")\n            continue\n\n    if not rows:\n        print(\"ORDER-BOOK: هیچ ردیف قابل‌پردازشی نبود -- نمونه:\", levels[:1] if levels else None)\n        return None\n\n    rows.sort(key=lambda r: r[0])\n\n    now = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n    try:\n        conn = sqlite3.connect(db_path)\n        cur = conn.cursor()\n        _ensure_table(cur)\n        for level, bc, bv, bp, sp, sv, sc in rows:\n            cur.execute(\n                \"INSERT INTO order_book(time, level, buy_count, buy_volume, buy_price, \"\n                \"sell_price, sell_volume, sell_count) VALUES (?,?,?,?,?,?,?,?)\",\n                (now, level, bc, bv, bp, sp, sv, sc),\n            )\n        conn.commit()\n        conn.close()\n    except Exception as e:\n        print(\"ORDER-BOOK DB ERROR:\", e)\n\n    total_buy_vol = sum(r[2] for r in rows)\n    total_sell_vol = sum(r[5] for r in rows)\n    total_buy_cnt = sum(r[1] for r in rows)\n    total_sell_cnt = sum(r[6] for r in rows)\n    best_buy = rows[0][3] if rows else None\n    best_sell = rows[0][4] if rows else None\n    spread = (best_sell - best_buy) if (best_buy and best_sell and best_buy\u003e0 and best_sell\u003e0) else None\n    spread_pct = round((spread / best_buy) * 100, 3) if (spread and best_buy) else None\n\n    buy_side_empty = (best_buy in (None, 0)) and total_buy_vol == 0 and total_buy_cnt == 0\n    sell_side_empty = (best_sell in (None, 0)) and total_sell_vol == 0 and total_sell_cnt == 0\n\n    if buy_side_empty and not sell_side_empty:\n        print(\"⚠️ ORDER-BOOK WARNING: سمت خرید کاملاً صفره ولی سمت فروش داده داره -- \"\n              \"ممکنه صف فروش واقعی باشه، یا ممکنه TSETMC اسم فیلدهای خرید رو عوض کرده باشه \"\n              \"(دقیقاً همون باگ pMeOf ولی این‌بار سمت خرید). کلیدهای ردیف خام برای چک:\", levels[0] if levels else None)\n    elif sell_side_empty and not buy_side_empty:\n        print(\"⚠️ ORDER-BOOK WARNING: سمت فروش کاملاً صفره ولی سمت خرید داده داره -- \"\n              \"ممکنه صف خرید واقعی باشه، یا ممکنه نگاشت فیلد فروش دوباره عوض شده باشه. \"\n              \"کلیدهای ردیف خام برای چک:\", levels[0] if levels else None)\n\n    if buy_side_empty and sell_side_empty:\n        market_state = \"NO_DATA\"\n    elif sell_side_empty and not buy_side_empty:\n        market_state = \"LOCKED_BUY_QUEUE\"\n    elif buy_side_empty and not sell_side_empty:\n        market_state = \"LOCKED_SELL_QUEUE\"\n    else:\n        market_state = \"TWO_SIDED\"\n\n    imbalance = None\n    if market_state == \"TWO_SIDED\" and (total_buy_vol + total_sell_vol) \u003e 0:\n        imbalance = round(\n            (total_buy_vol - total_sell_vol) / (total_buy_vol + total_sell_vol) * 100, 1\n        )\n\n    if market_state in (\"LOCKED_BUY_QUEUE\", \"LOCKED_SELL_QUEUE\", \"NO_DATA\"):\n        pressure = market_state\n    elif imbalance is None:\n        pressure = \"UNKNOWN\"\n    elif imbalance \u003e 20:\n        pressure = \"BUY_HEAVY\"\n    elif imbalance \u003c -20:\n        pressure = \"SELL_HEAVY\"\n    else:\n        pressure = \"BALANCED\"\n\n    return {\n        \"time\": now,\n        \"best_buy\": best_buy,\n        \"best_sell\": best_sell,\n        \"spread\": spread,\n        \"spread_pct\": spread_pct,\n        \"total_buy_volume\": total_buy_vol,\n        \"total_sell_volume\": total_sell_vol,\n        \"total_buy_count\": total_buy_cnt,\n        \"total_sell_count\": total_sell_cnt,\n        \"market_state\": market_state,\n        \"imbalance_pct\": imbalance,\n        \"pressure\": pressure,\n        \"levels\": rows,\n    }\n\n\nif __name__ == \"__main__\":\n    result = collect_order_book()\n    if result:\n        print(\"=\" * 50)\n        print(\"عمق سفارش (تابلوخوانی زنده) - نسخه فیکس 2026-08-31\")\n        print(\"=\" * 50)\n        print(f\"وضعیت بازار: {result['market_state']}\")\n        print(f\"بهترین خرید: {result['best_buy']} | بهترین فروش: {result['best_sell']}\")\n        print(f\"اسپرد: {result['spread']} ({result['spread_pct']}%)\")\n        print(f\"حجم صف خرید (۵ ردیف): {result['total_buy_volume']:,.0f}\")\n        print(f\"حجم صف فروش (۵ ردیف): {result['total_sell_volume']:,.0f}\")\n        print(f\"بایاس: {result['imbalance_pct']}% -\u003e {result['pressure']}\")\n        print(\"\\nجزئیات 5 ردیف:\")\n        for lv in result['levels']:\n            print(f\"  level={lv[0]} buy={lv[3]} vol={lv[2]} cnt={lv[1]} | sell={lv[4]} vol={lv[5]} cnt={lv[6]}\")\n    else:\n        print(\"داده‌ای دریافت نشد -- پیام‌های بالا رو برای من بفرست تا فیلدها رو اصلاح کنم.\")"])</script><script>self.__next_f.push([1,"40:Tb42,"])</script><script>self.__next_f.push([1,"import sqlite3\nfrom datetime import datetime\n\nimport algo dules[name] = send_telegram_message\n            elif name == \"desktop\":\n                from desktop_notify import send_desktop_notification\n                _modules[name] = send_desktop_notification\n            elif name == \"learning\":\n                import learning_core\n                _modules[name] = learning_core\n            elif name == \"database\":\n                from database import create_database\n                _modules[name] = create_database\n            elif name == \"volume\":\n                from volume_analysis import VolumeAnalysis, PutCallRatio, OpenInterestAnalysis\n                _modules[name] = {\"vol\": VolumeAnalysis, \"pcr\": PutCallRatio, \"oi\": OpenInterestAnalysis}\n            else:\n                _modules[name] = None\n        except Exception as e:\n            state.log(f\"ماژول {name} بارگذاری نشد: {e}\", \"WARN\")\n            _modules[name] = None\n    return _modules[name]\n\n\ndef collect_market_data(symbol_config):\n    name = symbol_config[\"name\"]\n    db = symbol_config[\"db\"]\n    state.log(f\"📊 شروع جمع‌آوری دیتا: {name}\")\n    data = {\"name\": name, \"db\": db, \"timestamp\": datetime.now().isoformat(), \"stock\": {}, \"options\": {}, \"market\": {}, \"indicators\": {}}\n\n    try:\n        collector = get_module(\"collector\")\n        if collector:\n            collector()\n            state.log(f\"  ✅ قیمت سهم دریافت شد\")\n    except Exception as e:\n        state.log(f\"  ❌ خطا قیمت سهم: {e}\", \"ERROR\")\n\n    # اکتشافی -- تازه ساخته شده، هنوز روی داده‌ی زنده تست نشده. اگه فیلدها\n    # اشتباه بود، فقط لاگ می‌کنه و ادامه می‌ده، به بقیه‌ی تحلیل آسیب نمی‌زنه.\n    try:\n        from order_book import collect_order_book\n        ob = collect_order_book(db)\n        data[\"market\"][\"order_book\"] = ob\n        if ob:\n            state_labels = {\n                \"TWO_SIDED\": None,  # حالت عادی -- امتیاز/اسپرد معنادارن\n                \"LOCKED_BUY_QUEUE\": \"🔥 صف خرید قفل‌شده (هیچ فروشنده‌ای در ۵ ردیف نیست)\",\n                \"LOCKED_SELL_QUEUE\": \"🧊 صف فروش قفل‌شده (هیچ خریداری در ۵ ردیف نیست)\",\n                \"NO_DATA\": \"داده‌ای برای هیچ‌کدوم از دو طرف دریافت نشد\",\n            }\n            label = state_labels.get(ob[\"market_state\"])\n            if label:\n                state.log(f\"  ℹ️ عمق سفارش (اکتشافی): {label}\")\n            else:\n                state.log(\n                    f\"  ℹ️ عمق سفارش (اکتشافی): بایاس {ob['pressure']} ({ob['imbalance_pct']}%) | \"\n                    f\"اسپرد {ob['spread_pct']}%\"\n                )\n        else:\n            state.log(\"  ⚠️ عمق سفارش دریافت نشد (فیلدهای TSETMC رو چک کن)\", \"WARN\")\n    except Exception as e:\n        state.log(f\"  ⚠️ خطا عمق سفارش: {e}\", \"WARN\")\n\n    # اکتشافی -- تازه ساخته شده. اگه خبر جدید (کدال یا ناظر بازار) پیدا بشه،\n    # بلافاصله هشدار می‌ده -- نه فقط لاگ -- چون این نوع خبر می‌تونه قیمت رو\n    # ناگهانی جابه‌جا کنه.\n    try:\n        from daily_news import check_daily_news\n        news_items = check_daily_news(db)\n        data[\"market\"][\"news\"] = news_items\n        for it in news_items:\n            cat = it.get(\"category\", \"\")\n            state.log(f\"  📰 خبر جدید [{it['source']}/{cat}]: {it['title']}\")\n            send_notification(\n                {\"type\": \"NEWS\", \"message\": f\"📰 خبر جدید ({name})\\n\\nمنبع: {it['source']} | دسته: {cat}\\n{it['title']}\"},\n                name,\n            )\n        from news_impact import update_news_impact\n        update_news_impact(db)\n    except Exception as e:\n        state.log(f\"  ⚠️ خطا اخبار روزانه: {e}\", \"WARN\")\n\n    try:\n        from option_collector import collect_options\n        collect_options()\n        state.log(f\"  ✅ اطلاعات آپشن دریافت شد\")\n    except Exception as e:\n        state.log(f\"  ⚠️ خطا آپشن: {e}\", \"WARN\")\n\n    def _run_with_timeout(func, timeout=20):\n        \"\"\"اجرای تابع با تایم‌اوت تا کل سیکل هنگ نکنه (مخصوص algotik_tse که گاهی هنگ می‌کنه).\n\n        نکته‌ی مهم: نباید از `with ThreadPoolExecutor(...) as executor` استفاده\n        بشه -- خروج از اون بلاک به‌صورت پیش‌فرض shutdown(wait=True) صدا می‌زنه،\n        یعنی صبر می‌کنه thread هنگ‌کرده واقعاً تموم بشه، که دقیقاً همون هنگ\n        کردنی رو که این تابع قراره جلوش رو بگیره دوباره برمی‌گردونه (فقط با\n        یه پیام هشدار زودتر که گمراه‌کننده‌ست، چون کل سیکل بازم قفل می‌مونه).\n        \"\"\"\n        executor = concurrent.futures.ThreadPoolExecutor(max_workers=1)\n        future = executor.submit(func)\n        try:\n            result = future.result(timeout=timeout)\n            executor.shutdown(wait=False)\n            return result\n        except concurrent.futures.TimeoutError:\n            state.log(f\"  ⚠️ تایم‌اوت {timeout}ث در {getattr(func, '__name__', 'func')} - رد شد\", \"WARN\")\n            executor.shutdown(wait=False)\n            return None\n        except Exception as e:\n            executor.shutdown(wait=False)\n            raise e\n\n    try:\n        index_feed = get_module(\"index_feed\")\n        if index_feed:\n            indices = _run_with_timeout(index_feed, timeout=20)\n            if indices is not None:\n                data[\"market\"][\"indices\"] = indices\n                state.log(f\"  ✅ شاخص‌ها دریافت شد\")\n            else:\n                state.log(f\"  ⚠️ شاخص‌ها تایم‌اوت/خالی - ادامه بدون شاخص\", \"WARN\")\n    except Exception as e:\n        state.log(f\"  ⚠️ خطا شاخص: {e}\", \"WARN\")\n\n    try:\n        money_flow = get_module(\"money_flow\")\n        if money_flow:\n            flow = _run_with_timeout(money_flow, timeout=20)\n            if flow is not None:\n                data[\"market\"][\"money_flow\"] = flow\n                state.log(f\"  ✅ جریان پول دریافت شد\")\n            else:\n                state.log(f\"  ⚠️ جریان پول تایم‌اوت/خالی - ادامه بدون جریان پول\", \"WARN\")\n    except Exception as e:\n        state.log(f\"  ⚠️ خطا جریان پول: {e}\", \"WARN\")\n\n    try:\n        hv_func = get_module(\"option_engine\")[\"hv\"]\n        hv = hv_func(db)\n        data[\"stock\"][\"hv\"] = hv\n        if hv:\n            state.log(f\"  ✅ نوسان تاریخی: {round(hv*100,1)}%\")\n    except Exception as e:\n        state.log(f\"  ⚠️ خطا HV: {e}\", \"WARN\")\n\n    return data\n\n\ndef analyze_technicals(symbol_config):\n    name = symbol_config[\"name\"]\n    db = symbol_config[\"db\"]\n    state.log(f\"📈 تحلیل تکنیکال: {name}\")\n    result = {\"action\": \"WATCH\", \"confidence\": 0, \"score\": 0, \"price\": 0, \"indicators\": {}, \"reasons\": []}\n\n    try:\n        Strategy = get_module(\"strategy\")\n        if Strategy:\n            strategy = Strategy(db_path=db)\n            analysis = strategy.analyze()\n            strategy.close()\n            if analysis:\n                action, confidence, score, price = analysis\n                result[\"action\"] = action\n                result[\"confidence\"] = confidence\n                result[\"score\"] = score\n                result[\"price\"] = price\n                state.log(f\"  ✅ نتیجه: {action} | امتیاز: {score} | اطمینان: {confidence}%\")\n            else:\n                state.log(f\"  ⚠️ داده کافی نیست\", \"WARN\")\n    except Exception as e:\n        state.log(f\"  ❌ خطا تحلیل: {e}\", \"ERROR\")\n\n    if result[\"price\"] \u003c= 0 and result[\"action\"] != \"WATCH\":\n        state.log(f\"  ⚠️ قیمت نامعتبر ({result['price']}) با اکشن {result['action']} -\u003e اجباری WATCH\", \"WARN\")\n        result[\"action\"] = \"WATCH\"\n\n    return result\n\n\ndef analyze_options(symbol_config, stock_action, stock_confidence, stock_price):\n    name = symbol_config[\"name\"]\n    db = symbol_config[\"db\"]\n    state.log(f\"🎯 تحلیل آپشن: {name}\")\n    result = {\"selected\": None, \"wiv\": None, \"fog\": None, \"tape\": None,\n               \"volume_analysis\": None, \"gamma_exposure\": None, \"iv_rank\": None,\n               \"advanced_greeks\": None}\n\n    try:\n        OptionSelector = get_module(\"option_selector\")\n        if OptionSelector:\n            selector = OptionSelector(db_path=db)\n            option = selector.run(stock_action=stock_action, stock_confidence=stock_confidence, current_stock_price=stock_price)\n            selector.close()\n            if option:\n                result[\"selected\"] = option\n                result[\"advanced_greeks\"] = option.get(\"advanced_greeks\")\n                state.log(f\"  ✅ آپشن انتخاب شد: {option.get('symbol')}\")\n                ag = result[\"advanced_greeks\"] or {}\n                if ag.get(\"available\"):\n                    state.log(\n                        f\"  ℹ️ Greeks پیشرفته (اکتشافی): {ag.get('risk_level')} | \"\n                        f\"Charm/day {ag.get('charm_1d')} | Vanna/1% {ag.get('vanna_1pct')} | \"\n                        f\"Volga/1% {ag.get('volga_1pct')}\"\n                    )\n            else:\n                state.log(f\"  ⚠️ آپشن مناسب پیدا نشد\", \"WARN\")\n    except Exception as e:\n        state.log(f\"  ❌ خطا انتخاب آپشن: {e}\", \"ERROR\")\n\n    # اکتشافی -- فقط اطلاعاتی؛ روی امتیاز/تصمیم BUY-SELL هیچ اثری نداره.\n    if _HAS_GAMMA:\n        try:\n            gx = analyze_gamma_exposure(db, stock_price=stock_price)\n            result[\"gamma_exposure\"] = gx\n            if gx.get(\"gamma_wall\"):\n                state.log(\n                    f\"  ℹ️ گاما (اکتشافی): دیواره {gx['gamma_wall']:,.0f} | \"\n                    f\"بایاس {gx['regime_bias']} ({gx.get('bias_pct')}%) | \"\n                    f\"اطمینان {gx['confidence']}\"\n                )\n                sel = result.get(\"selected\")\n                if sel and sel.get(\"strike_price\"):\n                    try:\n                        dist = abs(float(sel[\"strike_price\"]) - gx[\"gamma_wall\"]) / gx[\"gamma_wall\"] * 100\n                        if dist \u003c 3 and gx[\"confidence\"] != \"LOW\":\n                            sel.setdefault(\"reasons\", []).append(\n                                f\"⚠️ نزدیک دیواره‌ی گاما ({gx['gamma_wall']:,.0f}) -- احتمال محدودشدن نوسان (اکتشافی)\"\n                            )\n                    except Exception:\n                        pass\n        except Exception as e:\n            state.log(f\"  ⚠️ خطا گاما اکسپوژر: {e}\", \"WARN\")\n\n    # اکتشافی -- IV امروز نسبت به تاریخچه‌ی خودش (نه نسبت به HV مثل fog_meter).\n    # روی امتیاز/تصمیم اثر نمی‌ذاره تا وقتی حداقل چند هفته داده جمع بشه.\n    if _HAS_IVRANK:\n        try:\n            sel = result.get(\"selected\")\n            cur_iv = sel.get(\"implied_volatility\") if sel else None\n            if cur_iv:\n                record_daily_iv(db, cur_iv)\n            ivr = compute_iv_rank_percentile(db, current_iv=cur_iv)\n            result[\"iv_rank\"] = ivr\n            if ivr[\"ready\"]:\n                state.log(\n                    f\"  ℹ️ IV Rank (اکتشافی): {ivr['iv_rank']}% | \"\n                    f\"IV Percentile: {ivr['iv_percentile']}% | بر پایه‌ی {ivr['days']} روز\"\n                )\n                if sel and ivr[\"iv_rank\"] is not None:\n                    if ivr[\"iv_rank\"] \u003e= 80:\n                        sel.setdefault(\"reasons\", []).append(\n                            f\"⚠️ IV Rank بالا ({ivr['iv_rank']}%) -- پرمیوم نسبت به تاریخچه‌ی خودش گرونه (اکتشافی)\"\n                        )\n                    elif ivr[\"iv_rank\"] \u003c= 20:\n                        sel.setdefault(\"reasons\", []).append(\n                            f\"ℹ️ IV Rank پایین ({ivr['iv_rank']}%) -- پرمیوم نسبت به تاریخچه‌ی خودش ارزونه (اکتشافی)\"\n                        )\n            else:\n                state.log(f\"  ℹ️ IV Rank: داده کافی نیست ({ivr['days']}/{_IV_MIN_DAYS} روز)\")\n        except Exception as e:\n            state.log(f\"  ⚠️ خطا IV Rank: {e}\", \"WARN\")\n\n    try:\n        WIVCalculator = get_module(\"wiv\")\n        if WIVCalculator:\n            wiv_calc = WIVCalculator()\n            wiv_value = wiv_calc.calculate()\n            if wiv_value:\n                result[\"wiv\"] = wiv_calc.details\n                state.log(f\"  ✅ WIV: {wiv_calc.details.get('wiv_pct')}% ({wiv_calc.details.get('wiv_level')})\")\n    except Exception as e:\n        state.log(f\"  ⚠️ خطا WIV: {e}\", \"WARN\")\n\n    try:\n        fog_measure = get_module(\"fog_meter\")\n        if fog_measure:\n            price = stock_price or 0\n            level, ratio, advice = fog_measure(price, db)\n            result[\"fog\"] = {\"level\": level, \"ratio\": ratio, \"advice\": advice}\n            state.log(f\"  ✅ FOG: {level} ({ratio})\")\n    except Exception as e:\n        state.log(f\"  ⚠️ خطا FOG: {e}\", \"WARN\")\n\n    try:\n        tape = get_module(\"tape_reader\")\n        if tape:\n            passed, score, details = tape.evaluate()\n            result[\"tape\"] = {\"passed\": passed, \"score\": score, \"details\": details}\n            if passed is not None:\n                state.log(f\"  ✅ TAPE: {score}/5\")\n    except Exception as e:\n        state.log(f\"  ⚠️ خطا TAPE: {e}\", \"WARN\")\n\n    # تحلیل حجم\n    vol_mod = get_module(\"volume\")\n    if vol_mod:\n        try:\n            vol_analysis = vol_mod[\"vol\"](db)\n            vol_signal = vol_analysis.calculate()\n            \n            pcr = vol_mod[\"pcr\"](db)\n            pcr_signal = pcr.calculate()\n            \n            oi = vol_mod[\"oi\"](db)\n            oi_signal = oi.calculate()\n            \n            result[\"volume_analysis\"] = {\n                \"volume\": vol_signal,\n                \"put_call\": pcr_signal,\n                \"open_interest\": oi_signal,\n                \"details\": vol_analysis.details,\n            }\n            state.log(f\"  ✅ تحلیل حجم: {vol_signal} | Put/Call: {pcr_signal} | OI: {oi_signal}\")\n        except Exception as e:\n            state.log(f\"  ⚠️ خطا تحلیل حجم: {e}\", \"WARN\")\n\n    return result\n\n\ndef generate_multi_layer_signal(symbol_config, technicals, options_analysis, market_data):\n    name = symbol_config[\"name\"]\n    state.log(f\"🚦 تولید سیگنال: {name}\")\n\n    checks = {\n        \"technicals_ok\": False,\n        \"volume_ok\": False,\n        \"option_ok\": False,\n        \"wiv_ok\": False,\n        \"fog_ok\": False,\n        \"tape_ok\": False,\n        \"market_ok\": False,\n    }\n\n    reasons = []\n    score = technicals.get(\"score\", 0)\n\n    if technicals[\"action\"] in (\"BUY\", \"STRONG BUY\"):\n        checks[\"technicals_ok\"] = True\n        reasons.append(\"✅ تحلیل تکنیکال: صعودی\")\n    elif technicals[\"action\"] in (\"SELL\", \"STRONG SELL\"):\n        checks[\"technicals_ok\"] = True\n        reasons.append(\"✅ تحلیل تکنیکال: نزولی\")\n    else:\n        reasons.append(\"❌ تحلیل تکنیکال: خنثی\")\n\n    option = options_analysis.get(\"selected\")\n    if option:\n        checks[\"option_ok\"] = True\n        reasons.append(f\"✅ آپشن: {option.get('symbol')}\")\n    else:\n        reasons.append(\"❌ آپشن: نامناسب\")\n\n    wiv_data = options_analysis.get(\"wiv\")\n    if wiv_data:\n        wiv_level = wiv_data.get(\"wiv_level\", \"UNKNOWN\")\n        wiv_pct = wiv_data.get(\"wiv_pct\", 100)\n        if wiv_pct \u003c= CONFIG[\"max_wiv_for_buy\"]:\n            checks[\"wiv_ok\"] = True\n            reasons.append(f\"✅ WIV: {wiv_pct}% ({wiv_level})\")\n        else:\n            reasons.append(f\"❌ WIV: {wiv_pct}% (گران)\")\n\n    fog_data = options_analysis.get(\"fog\")\n    if fog_data:\n        fog_level = fog_data.get(\"level\", \"UNKNOWN\")\n        if fog_level in (\"CLEAN\", \"LIGHT\"):\n            checks[\"fog_ok\"] = True\n            reasons.append(f\"✅ FOG: {fog_level}\")\n        else:\n            reasons.append(f\"❌ FOG: {fog_level}\")\n\n    tape_data = options_analysis.get(\"tape\")\n    if tape_data:\n        if tape_data.get(\"passed\"):\n            checks[\"tape_ok\"] = True\n            reasons.append(f\"✅ TAPE: {tape_data.get('score')}/5\")\n        else:\n            reasons.append(f\"⚠️ TAPE: {tape_data.get('score')}/5\")\n\n    # بررسی تحلیل حجم\n    vol_data = options_analysis.get(\"volume_analysis\")\n    if vol_data:\n        vol_final = vol_data.get(\"volume\", \"NEUTRAL\")\n        if vol_final == \"BUY\":\n            checks[\"volume_ok\"] = True\n            reasons.append(f\"✅ حجم: صعودی\")\n        elif vol_final == \"SELL\":\n            checks[\"volume_ok\"] = False\n            reasons.append(f\"❌ حجم: نزولی\")\n        else:\n            checks[\"volume_ok\"] = False\n            reasons.append(f\"⚠️ حجم: خنثی\")\n\n    indices = market_data.get(\"indices\")\n    money_flow = market_data.get(\"money_flow\")\n    if indices or money_flow:\n        checks[\"market_ok\"] = True\n        reasons.append(\"✅ فضای بازار: بررسی شد\")\n\n    passed_checks = sum(1 for v in checks.values() if v)\n    total_checks = len(checks)\n    check_score = (passed_checks / total_checks) * 100\n    final_score = (score * 0.6) + (check_score * 0.4)\n\n    ml_reason = None\n    if _HAS_ML and option:\n        try:\n            db_path = symbol_config.get(\"db\")\n            ml_adj, ml_reason = ml_adjust.get_ml_adjustment(option, final_score, db_path)\n            if ml_adj:\n                final_score = max(0.0, min(100.0, final_score + ml_adj))\n                reasons.append(f\"🧠 {ml_reason}\")\n        except Exception as e:\n            state.log(f\"  ⚠️ خطا تعدیل ML: {e}\", \"WARN\")\n\n    min_checks = 3\n\n    if passed_checks \u003e= min_checks and final_score \u003e= CONFIG[\"min_score\"] and option:\n        if technicals[\"action\"] in (\"BUY\", \"STRONG BUY\"):\n            signal_type = \"BUY_CALL\"\n        elif technicals[\"action\"] in (\"SELL\", \"STRONG SELL\"):\n            signal_type = \"BUY_PUT\"\n        else:\n            signal_type = \"WATCH\"\n    else:\n        if passed_checks \u003e= min_checks and final_score \u003e= CONFIG[\"min_score\"] and not option:\n            state.log(\n                \"  ⚠️ شرایط تکنیکال/چک‌ها برای BUY کافی بود ولی هیچ آپشنی انتخاب نشد -\u003e WATCH\",\n                \"WARN\",\n            )\n        signal_type = \"WATCH\"\n\n    display_score = max(0, round(final_score))  # فقط برای نمایش؛ تصمیم BUY/WATCH بالاتر با مقدار خام گرفته شده\n\n    signal = {\n        \"type\": signal_type,\n        \"score\": display_score,\n        \"checks_passed\": passed_checks,\n        \"checks_total\": total_checks,\n        \"reasons\": reasons,\n        \"option\": option,\n        \"timestamp\": datetime.now().isoformat(),\n    }\n\n    if signal_type in (\"BUY_CALL\", \"BUY_PUT\") and option:\n        targets = _calculate_targets(option, signal_type)\n        signal[\"targets\"] = targets\n        signal[\"message\"] = _format_signal_message(signal, name)\n    else:\n        signal[\"message\"] = f\"\\n{name}: {signal_type} (امتیاز: {display_score})\\n\"\n\n    state.log(f\"  نتیجه: {signal_type} | امتیاز: {display_score} | شرایط: {passed_checks}/{total_checks}\")\n\n    return signal\n\n\ndef _calculate_targets(option, signal_type):\n    entry = float(option.get(\"option_price\", 0))\n    dte = int(option.get(\"days_to_expire\", 30))\n    if entry \u003c= 0:\n        return None\n    if dte \u003c= 7:\n        sl_pct = 0.10\n    elif dte \u003c= 21:\n        sl_pct = 0.12\n    else:\n        sl_pct = 0.15\n    t1_pct = 0.15\n    t2_pct = 0.30\n    return {\n        \"entry\": round(entry),\n        \"stop_loss\": round(entry * (1 - sl_pct)),\n        \"stop_loss_pct\": round(sl_pct * 100),\n        \"target1\": round(entry * (1 + t1_pct)),\n        \"target1_pct\": round(t1_pct * 100),\n        \"target2\": round(entry * (1 + t2_pct)),\n        \"target2_pct\": round(t2_pct * 100),\n    }\n\n\ndef _format_signal_message(signal, symbol_name):\n    option = signal.get(\"option\", {})\n    targets = signal.get(\"targets\", {})\n    lines = []\n    lines.append(\"╔\" + \"═\" * 46 + \"╗\")\n    if signal[\"type\"] == \"BUY_CALL\":\n        lines.append(\"║\" + \"  🟢  سیگنال خرید کال  \".center(40) + \"║\")\n    else:\n        lines.append(\"║\" + \"  🔴  سیگنال خرید پوت  \".center(40) + \"║\")\n    lines.append(\"╚\" + \"═\" * 46 + \"╝\")\n    lines.append(\"\")\n    lines.append(f\"📊 نماد: {symbol_name}\")\n    lines.append(f\"📈 امتیاز: {signal['score']}/100\")\n    lines.append(f\"✅ شرایط: {signal['checks_passed']}/{signal['checks_total']}\")\n    lines.append(\"\")\n    if option:\n        lines.append(f\"🎯 قرارداد: {option.get('symbol')}\")\n        lines.append(f\"   نوع: {option.get('option_type')}\")\n        lines.append(f\"   قیمت اعمال: {option.get('strike_price'):,}\")\n        lines.append(f\"   سررسید: {option.get('expire_date')} ({option.get('days_to_expire')} روز)\")\n        lines.append(f\"   قیمت آپشن: {option.get('option_price'):,}\")\n        lines.append(f\"   دلتا: {option.get('delta')}\")\n        lines.append(\"\")\n    if targets:\n        lines.append(f\"🛑 حد ضرر: {targets['stop_loss']:,} (-{targets['stop_loss_pct']}%)\")\n        lines.append(f\"🎯 هدف اول: {targets['target1']:,} (+{targets['target1_pct']}%)\")\n        lines.append(f\"🚀 هدف دوم: {targets['target2']:,} (+{targets['target2_pct']}%)\")\n        lines.append(\"\")\n    lines.append(\"📋 دلایل:\")\n    for reason in signal.get(\"reasons\", []):\n        lines.append(f\"   {reason}\")\n    lines.append(\"\")\n    lines.append(\"━\" * 46)\n    return \"\\n\".join(lines)\n\n\ndef send_notification(signal, symbol_name):\n    if signal[\"type\"] == \"WATCH\":\n        return\n    message = signal.get(\"message\", \"\")\n    title = f\"AHRAM AI - {signal['type']} {symbol_name}\"\n    if CONFIG[\"telegram_enabled\"]:\n        try:\n            telegram = get_module(\"telegram\")\n            if telegram:\n                ok = telegram(f\"{title}\\n\\n{message}\")\n                if ok:\n                    state.log(\"  ✅ تلگرام ارسال شد\")\n                else:\n                    state.log(\"  ⚠️ تلگرام ارسال نشد (بدون پاسخ موفق از سرور)\", \"WARN\")\n        except Exception as e:\n            state.log(f\"  ❌ خطا تلگرام: {e}\", \"ERROR\")\n    if CONFIG[\"desktop_enabled\"]:\n        try:\n            desktop = get_module(\"desktop\")\n            if desktop:\n                ok = desktop(title, message[:200])\n                if ok:\n                    state.log(\"  ✅ دسکتاپ ارسال شد\")\n                else:\n                    state.log(\"  ⚠️ دسکتاپ ارسال نشد\", \"WARN\")\n        except Exception as e:\n            state.log(f\"  ❌ خطا دسکتاپ: {e}\", \"ERROR\")\n\n\ndef log_signal_to_db(signal, symbol_name, db_name):\n    \"\"\"ذخیره تمام سیگنال‌ها (BUY و WATCH) در دیتابیس\"\"\"\n    try:\n        conn = sqlite3.connect(db_name)\n        cur = conn.cursor()\n        \n        cur.execute(\"\"\"\n            CREATE TABLE IF NOT EXISTS signal_history (\n                id INTEGER PRIMARY KEY AUTOINCREMENT,\n                time TEXT,\n                symbol TEXT,\n                signal_type TEXT,\n                composite_score REAL,\n                option_symbol TEXT,\n                option_price REAL,\n                strike_price REAL,\n                stop_loss REAL,\n                target1 REAL,\n                target2 REAL,\n                outcome TEXT DEFAULT 'PENDING',\n                outcome_pct REAL DEFAULT 0,\n                details TEXT\n            )\n        \"\"\")\n        \n        cur.execute(\"PRAGMA table_info(signal_history)\")\n        columns = [row[1] for row in cur.fetchall()]\n        \n        required_columns = {\n            \"option_symbol\": \"TEXT\",\n            \"option_price\": \"REAL\",\n            \"strike_price\": \"REAL\",\n            \"stop_loss\": \"REAL\",\n            \"target1\": \"REAL\",\n            \"target2\": \"REAL\",\n            \"composite_score\": \"REAL\",\n            \"signal_type\": \"TEXT\",\n            \"details\": \"TEXT\",\n            \"position_id\": \"TEXT\",\n        }\n        \n        for col_name, col_type in required_columns.items():\n            if col_name not in columns:\n                try:\n                    cur.execute(f\"ALTER TABLE signal_history ADD COLUMN {col_name} {col_type}\")\n                except Exception as _e:\n                    state.log(f\"⚠️ ستون {col_name} اضافه نشد: {_e}\", \"WARN\")\n        \n        conn.commit()\n\n        option = signal.get(\"option\", {})\n        targets = signal.get(\"targets\", {})\n        opt_sym = option.get(\"symbol\") if option else None\n        direction = signal[\"type\"]\n\n        # position_id: یه پوزیشن واقعی -- تا وقتی برای همین\n        # (نماد پایه + قرارداد + جهت) یه ردیف PENDING/T1_HIT باز هست، همون\n        # position_id قبلی استفاده می‌شه (یعنی هر بار سیگنال تکرار بشه، به\n        # همون معامله وصل می‌مونه، حتی اگه چند روز طول بکشه). به محض اینکه\n        # اون پوزیشن WIN/LOSS بشه، اگه همون قرارداد دوباره سیگنال بگیره، یه\n        # position_id کاملاً جدید و مستقل می‌گیره.\n        position_id = None\n        if opt_sym and direction in (\"BUY_CALL\", \"BUY_PUT\", \"BUY\", \"STRONG BUY\"):\n            cur.execute(\n                \"SELECT position_id FROM signal_history WHERE symbol=? AND option_symbol=? \"\n                \"AND signal_type=? AND outcome IN ('PENDING','T1_HIT') AND position_id IS NOT NULL \"\n                \"ORDER BY id DESC LIMIT 1\",\n                (symbol_name, opt_sym, direction),\n            )\n            r = cur.fetchone()\n            if r and r[0]:\n                position_id = r[0]\n            else:\n                slug = symbol_name.replace(\" \", \"\")\n                position_id = f\"{slug}-{opt_sym}-{direction}-{datetime.now().strftime('%Y%m%d-%H%M%S')}\"\n\n        cur.execute(\"\"\"\n            INSERT INTO signal_history \n            (time, symbol, signal_type, composite_score, option_symbol, \n             option_price, strike_price, stop_loss, target1, target2, details, position_id)\n            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n        \"\"\", (\n            datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\"),\n            symbol_name,\n            signal[\"type\"],\n            signal[\"score\"],\n            opt_sym,\n            option.get(\"option_price\") if option else None,\n            option.get(\"strike_price\") if option else None,\n            targets.get(\"stop_loss\") if targets else None,\n            targets.get(\"target1\") if targets else None,\n            targets.get(\"target2\") if targets else None,\n            json.dumps(signal, ensure_ascii=False, default=str),\n            position_id,\n        ))\n        \n        conn.commit()\n        conn.close()\n        state.log(f\"  ✅ سیگنال در دیتابیس ذخیره شد\")\n    except Exception as e:\n        state.log(f\"  ❌ خطا دیتابیس: {e}\", \"ERROR\")\n\n\ndef check_live_exits_for_symbol(name, db):\n    \"\"\"پوزیشن‌های باز این نماد رو با قیمت لحظه‌ای آپشن مقایسه می‌کنه و اگه به\n    هدف/حد ضرر رسیده باشن، بلافاصله هشدار می‌ده (به‌جای اینکه فقط ساکت توی\n    دیتابیس آپدیت بشه و کاربر تا سیکل بعدی داشبورد متوجه نشه).\"\"\"\n    alerts = []\n    try:\n        conn = sqlite3.connect(db)\n        cur = conn.cursor()\n        cur.execute(\n            \"SELECT position_id, option_symbol, option_price, stop_loss, target1, target2, outcome, MIN(id) \"\n            \"FROM signal_history WHERE outcome IN ('PENDING','T1_HIT') \"\n            \"AND position_id IS NOT NULL GROUP BY position_id\"\n        )\n        rows = cur.fetchall()\n        for pos_id, sym, entry, sl, t1, t2, outcome, _min_id in rows:\n            entry_f = float(entry) if entry else 0\n            if entry_f \u003c= 0:\n                continue\n            cur.execute(\"SELECT option_price FROM options WHERE symbol=? ORDER BY id DESC LIMIT 1\", (sym,))\n            pr = cur.fetchone()\n            if not pr or not pr[0]:\n                continue\n            cur_price = float(pr[0])\n            sl_f = float(sl) if sl else None\n            t1_f = float(t1) if t1 else None\n            t2_f = float(t2) if t2 else None\n\n            new_outcome = None\n            if sl_f and cur_price \u003c= sl_f:\n                new_outcome = \"LOSS\"\n            elif t2_f and cur_price \u003e= t2_f:\n                new_outcome = \"WIN\"\n            elif t1_f and cur_price \u003e= t1_f and outcome == \"PENDING\":\n                new_outcome = \"T1_HIT\"\n\n            if new_outcome and new_outcome != outcome:\n                pct = round(((cur_price - entry_f) / entry_f) * 100, 1)\n                # همه‌ی ردیف‌های همین position_id با هم بسته می‌شن -- یه\n                # معامله‌ست، نه چندتا -- وگرنه چندین هشدار تکراری فرستاده می‌شه\n                cur.execute(\n                    \"UPDATE signal_history SET outcome=?, outcome_pct=? \"\n                    \"WHERE position_id=? AND outcome IN ('PENDING','T1_HIT')\",\n                    (new_outcome, pct, pos_id),\n                )\n                alerts.append((sym, new_outcome, pct, cur_price))\n        conn.commit()\n        conn.close()\n    except Exception as e:\n        state.log(f\"  ⚠️ خطا بررسی خروج زنده: {e}\", \"WARN\")\n        return\n\n    for sym, new_outcome, pct, cur_price in alerts:\n        label = {\"WIN\": \"🎯 رسیدن به هدف نهایی\", \"LOSS\": \"🛑 برخورد به حد ضرر\",\n                  \"T1_HIT\": \"✅ رسیدن به هدف اول\"}.get(new_outcome, new_outcome)\n        state.log(f\"  {label}: {sym} ({pct:+}%)\")\n        msg = f\"{label}\\n\\nنماد: {name}\\nقرارداد: {sym}\\nقیمت فعلی: {cur_price:,.0f}\\nسود/زیان: {pct:+}%\"\n        send_notification({\"type\": \"EXIT\", \"message\": msg}, name)\n\n\ndef _count_total_open_positions():\n    \"\"\"تعداد واقعی پوزیشن‌های باز (position_id یکتا با outcome PENDING/T1_HIT)\n    در کل سه دیتابیس -- state.open_positions فقط برای جلوگیری از\n    نوتیفیکیشن تکراریه (حداکثر یه ورودی به‌ازای هر نماد)، نه شمارش واقعی\n    ریسک باز؛ چون وقتی cooldown تموم بشه و قرارداد جدیدی برای همون نماد\n    انتخاب بشه، رکورد قرارداد قبلی توی state بی‌صدا بازنویسی می‌شه، در حالی\n    که توی دیتابیس همچنان PENDING مونده. برای کنترل واقعی ریسک، باید از\n    دیتابیس شمرد، نه از حافظه.\"\"\"\n    total = 0\n    for sym in CONFIG[\"symbols\"]:\n        try:\n            conn = sqlite3.connect(sym[\"db\"])\n            cur = conn.cursor()\n            cur.execute(\n                \"SELECT COUNT(DISTINCT position_id) FROM signal_history \"\n                \"WHERE outcome IN ('PENDING','T1_HIT') AND position_id IS NOT NULL\"\n            )\n            total += cur.fetchone()[0] or 0\n            conn.close()\n        except Exception:\n            continue\n    return total\n\n\ndef analyze_symbol(symbol_config):\n    name = symbol_config[\"name\"]\n    db = symbol_config[\"db\"]\n    state.log(f\"\\n{'#' * 60}\")\n    state.log(f\"# {name}\")\n    state.log(f\"{'#' * 60}\")\n\n    import config\n    config.UNDERLYING = name\n    config.DATABASE_NAME = db\n    config.INS_CODE = symbol_config[\"ins_code\"]\n    config.OPTION_ROOT = symbol_config.get(\"option_root\", \"\")\n\n    if _HAS_ML:\n        try:\n            if ml_adjust.needs_daily_update(db):\n                result = ml_adjust.train_model(db)\n                state.log(f\"  🧠 آموزش مدل: {result.get('message', result)}\")\n        except Exception as e:\n            state.log(f\"  ⚠️ خطا آموزش مدل: {e}\", \"WARN\")\n\n    market_data = collect_market_data(symbol_config)\n    check_live_exits_for_symbol(name, db)\n    technicals = analyze_technicals(symbol_config)\n    options_analysis = analyze_options(symbol_config, technicals[\"action\"], technicals[\"confidence\"], technicals[\"price\"])\n    signal = generate_multi_layer_signal(symbol_config, technicals, options_analysis, market_data.get(\"market\", {}))\n\n    # ✅ ذخیره تمام سیگنال‌ها (BUY و WATCH) — این رفتار قبلی دست‌نخورده می‌مونه،\n    # چون گزارش روزانه به رکورد هر سیکل (چه BUY چه WATCH) نیاز داره.\n    log_signal_to_db(signal, name, db)\n\n    if signal[\"type\"] != \"WATCH\":\n        direction = signal[\"type\"]\n        existing = state.open_positions.get(name)\n        max_hold = timedelta(hours=CONFIG.get(\"max_position_hold_hours\", 3))\n        still_open = (\n            existing is not None\n            and existing[\"direction\"] == direction\n            and (datetime.now() - existing[\"since\"]) \u003c max_hold\n        )\n\n        if still_open:\n            state.log(\n                f\"  ℹ️ سیگنال {direction} تکراریه (پوزیشن از {existing['since'].strftime('%H:%M')} \"\n                f\"باز فرض می‌شه) -\u003e نوتیفیکیشن دوباره ارسال نشد\", \"INFO\"\n            )\n        elif name not in state.open_positions and _count_total_open_positions() \u003e= CONFIG[\"max_positions\"]:\n            state.log(\n                f\"  ⚠️ به سقف {CONFIG['max_positions']} پوزیشن هم‌زمان رسیدیم -\u003e \"\n                f\"نوتیفیکیشن {direction} برای {name} ارسال نشد\", \"WARN\"\n            )\n        else:\n            state.open_positions[name] = {\"direction\": direction, \"since\": datetime.now()}\n            send_notification(signal, name)\n            state.signals_generated += 1\n            state.last_signal_time = datetime.now()\n    else:\n        # برگشتن به WATCH یعنی شرایط فنی/آپشن دیگه پابرجا نیست -\u003e پوزیشن قبلی آزاد می‌شه\n        if name in state.open_positions:\n            state.log(f\"  ℹ️ شرایط {name} به WATCH برگشت -\u003e پوزیشن باز قبلی آزاد شد\", \"INFO\")\n            del state.open_positions[name]\n\n    print(signal.get(\"message\", f\"\\n{name}: {signal['type']} (امتیاز: {signal['score']})\"))\n    print()\n\n    return signal\n\n\ndef run_cycle():\n    state.cycles += 1\n    print(\"\\n\" + \"=\" * 60)\n    print(f\"🔄 سیکل #{state.cycles} | {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\")\n    print(\"=\" * 60)\n\n    signals = []\n    for sym in CONFIG[\"symbols\"]:\n        try:\n            signal = analyze_symbol(sym)\n            signals.append(signal)\n        except Exception as e:\n            state.log(f\"❌ خطا در تحلیل {sym['name']}: {e}\", \"ERROR\")\n\n    if CONFIG[\"dashboard_enabled\"]:\n        try:\n            dash = get_module(\"dashboard\")\n            if dash:\n                dash.generate()\n                state.log(\"📊 داشبورد بروزرسانی شد\")\n        except Exception as e:\n            state.log(f\"⚠️ خطا داشبورد: {e}\", \"WARN\")\n\n    return signals\n\n\ndef market_is_open():\n    now = datetime.now()\n    if now.weekday() in (3, 4):\n        return False\n    return CONFIG[\"market_open\"] \u003c= now.time() \u003c= CONFIG[\"market_close\"]\n\n\ndef run():\n    print(\"╔\" + \"═\" * 58 + \"╗\")\n    print(\"║\" + \"  AHRAM AI PRO v4.1  \".center(58) + \"║\")\n    print(\"║\" + \"  سیستم معامله‌گری تجمیعی آپشن  \".center(58) + \"║\")\n    print(\"╚\" + \"═\" * 58 + \"╝\")\n    print()\n    print(f\"📊 نمادها: {', '.join(s['name'] for s in CONFIG['symbols'])}\")\n    print(f\"⏰ ساعات: {CONFIG['market_open']} - {CONFIG['market_close']}\")\n    print(f\"🔄 سیکل: هر {CONFIG['cycle_seconds']} ثانیه\")\n    print()\n\n    while True:\n        try:\n            if market_is_open():\n                run_cycle()\n                state.log(f\"\\n⏳ سیکل بعدی در {CONFIG['cycle_seconds']} ثانیه...\")\n                time.sleep(CONFIG[\"cycle_seconds\"])\n            else:\n                now = datetime.now().strftime(\"%H:%M\")\n                print(f\"\\r[{now}] بازار بسته. در انتظار...\", end=\"\", flush=True)\n                time.sleep(120)\n        except KeyboardInterrupt:\n            print(\"\\n\\n🛑 سیستم متوقف شد.\")\n            state.log(f\"📊 آمار: {state.cycles} سیکل | {state.signals_generated} سیگنال\")\n            break\n        except Exception as e:\n            state.log(f\"❌ خطا: {e}\", \"ERROR\")\n            time.sleep(30)\n\n\nif __name__ == \"__main__\":\n    _enable_file_logging()\n    if \"--test\" in sys.argv:\n        run_cycle()\n    else:\n        run()"])</script><script>self.__next_f.push([1,"44:T1b6f,"])</script><scri f.conn:\n            self.conn.close()\n\n    def load_data(self):\n        query = \"\"\"\n            SELECT time, last_price, closing_price, volume\n            FROM prices\n            ORDER BY id\n        \"\"\"\n        df = pd.read_sql(query, self.conn)\n        if df.empty:\n            return None\n        if len(df) \u003c 20:\n            print(\"NOT ENOUGH DATA\")\n            return None\n        df[\"price\"] = df[\"last_price\"]\n        df[\"HIGH20\"] = df[\"last_price\"].rolling(20).max()\n        df[\"LOW20\"] = df[\"last_price\"].rolling(20).min()\n        return df\n\n    def _in_quiet_period(self):\n        now = datetime.now().time()\n        open_minutes = self.MARKET_OPEN.hour * 60 + self.MARKET_OPEN.minute\n        close_minutes = self.MARKET_CLOSE.hour * 60 + self.MARKET_CLOSE.minute\n        now_minutes = now.hour * 60 + now.minute\n        # اول چک کن اصلاً داخل بازه‌ی معاملاتی هستیم یا نه -- وگرنه چک‌های زیر\n        # (که فقط یه طرفشون باز/بسته‌ست) هر ساعتی بعد از ظهر تا صبح فردا رو هم\n        # به‌غلط \"نزدیک بسته شدن بازار\" حساب می‌کردن (باگ قدیمی: ۲۲:۰۲ شب هم\n        # QUIET PERIOD چاپ می‌شد چون شرط بالایی سقف نداشت).\n        if now_minutes \u003c open_minutes or now_minutes \u003e close_minutes:\n            return False\n        if now_minutes \u003c open_minutes + self.QUIET_START_MINUTES:\n            return True\n        if now_minutes \u003e close_minutes - self.QUIET_END_MINUTES:\n            return True\n        return False\n\n    def _detect_queue(self, locked_price):\n        try:\n            df = self.df\n            if \"time\" not in df.columns or len(df) \u003c 10:\n                return None, 0.0\n            times = df[\"time\"].astype(str)\n            today = str(times.iloc[-1])[:10]\n            prev = df[times.str[:10] != today][\"last_price\"]\n            if len(prev) \u003c 3:\n                return None, 0.0\n            yclose = float(prev.iloc[-1])\n            if yclose \u003c= 0:\n                return None, 0.0\n            gap = (locked_price - yclose) / yclose * 100.0\n            if gap \u003e= self.QUEUE_GAP_MIN:\n                return \"BUY\", round(gap, 2)\n            if gap \u003c= -self.QUEUE_GAP_MIN:\n                return \"SELL\", round(gap, 2)\n            return None, round(gap, 2)\n        except Exception:\n            return None, 0.0\n\n    @staticmethod\n    def _conviction(strength):\n        try:\n            if strength is None or pd.isna(strength):\n                return 0.0\n            s = float(strength)\n            if s != s:\n                return 0.0\n            return max(-1.0, min(1.0, (s - 50.0) / 50.0))\n        except Exception:\n            return 0.0\n\n    @staticmethod\n    def _regime_conviction(regime):\n        if not isinstance(regime, dict):\n            return 0.0\n        mag_map = {\"STRONG\": 1.0, \"MEDIUM\": 0.6, \"WEAK\": 0.3}\n        mag = mag_map.get(str(regime.get(\"strength\", \"\")).upper(), 0.5)\n        trend = regime.get(\"trend\")\n        if trend == \"BULL\":\n            return mag\n        if trend == \"BEAR\":\n            return -mag\n        return 0.0\n\n    def _calculate_score(self, mtf_signal, regime):\n        ich_c = self._conviction(self.ich.strength)\n        vwap_c = self._conviction(self.vwap.strength)\n        pa_c = self._conviction(self.pa.strength)\n        ha_c = self._conviction(self.ha_strength)\n        boll_c = self._conviction(self.boll.strength)\n        regime_c = self._regime_conviction(regime)\n        mtf_c = 1.0 if mtf_signal == \"BULLISH\" else (-1.0 if mtf_signal == \"BEARISH\" else 0.0)\n        fib_c = self._conviction(self.fib.strength) if self.fib else 0.0\n        rsi_div_c = self._conviction(self.rsi_div.strength) if self.rsi_div else 0.0\n        ema_c = self._conviction(self.ema_obj.strength) if self.ema_obj else 0.0\n        macd_c = self._conviction(self.macd_obj.strength) if self.macd_obj else 0.0\n        adx_c = self._conviction(self.adx_obj.strength) if self.adx_obj else 0.0\n\n        parts = [\n            (\"Ichimoku\", ich_c, 12),\n            (\"VWAP\", vwap_c, 6),\n            (\"Price Action\", pa_c, 10),\n            (\"Market Regime\", regime_c, 10),\n            (\"Heikin Ashi\", ha_c, 10),\n            (\"Multi-Timeframe\", mtf_c, 10),\n            (\"Bollinger\", boll_c, 6),\n            (\"Fibonacci\", fib_c, 9),\n            (\"RSI Divergence\", rsi_div_c, 8),\n            (\"EMA\", ema_c, 7),\n            (\"MACD\", macd_c, 6),\n            (\"ADX\", adx_c, 6),\n        ]\n\n        score = sum(conv * weight for _, conv, weight in parts)\n        bullish_count = sum(1 for _, c, _ in parts if c \u003e self.ALIGNED_CONV)\n        bearish_count = sum(1 for _, c, _ in parts if c \u003c -self.ALIGNED_CONV)\n        aligned_count = max(bullish_count, bearish_count)\n\n        reasons = [\n            f\"{name} {'Bullish' if c \u003e 0 else 'Bearish'}\"\n            for name, c, _ in parts\n            if abs(c) \u003e self.ALIGNED_CONV\n        ]\n        return score, reasons, aligned_count, bullish_count, bearish_count, parts\n\n    def analyze(self):\n        self.df = self.load_data()\n        if self.df is None:\n            return None\n\n        self.ich = Ichimoku(self.df)\n        ichimoku_signal = self.ich.calculate()\n\n        self.vwap = VWAP(self.df)\n        vwap_signal = self.vwap.calculate()\n\n        self.pa = PriceAction(self.df)\n        price_action = self.pa.analyze()\n\n        regime = MarketRegime(self.df).analyze()\n\n        heikin_signal = calculate_heikin_ashi(db_path=self.db_path)\n        self.ha_strength = (\n            _ha_module.LAST_RESULT.get(\"strength\", 50.0)\n            if isinstance(_ha_module.LAST_RESULT, dict) else 50.0\n        )\n\n        mtf_signal = calculate_multi_timeframe(db_path=self.db_path)\n\n        self.boll = Bollinger(self.df)\n        bollinger_signal = self.boll.calculate()\n\n        rsi_value = RSI(self.df).calculate()\n\n        self.fib = Fibonacci(self.df)\n        fib_signal = self.fib.calculate()\n\n        self.rsi_div = RSIDivergence(self.df)\n        rsi_div_signal = self.rsi_div.calculate()\n\n        self.ema_obj = EMA(self.df)\n        ema_signal = self.ema_obj.calculate()\n\n        self.macd_obj = MACD(self.df)\n        macd_signal = self.macd_obj.calculate()\n\n        self.adx_obj = ADX(self.df)\n        adx_signal = self.adx_obj.calculate()\n\n        recent_prices = self.df[\"last_price\"].tail(self.STALE_PRICE_TICKS)\n        flat = len(recent_prices) \u003e= self.STALE_PRICE_TICKS and recent_prices.nunique() == 1\n        stale_price = False\n        self.queue_type = None\n        self.queue_gap = 0.0\n        if flat:\n            locked = float(recent_prices.iloc[-1])\n            self.queue_type, self.queue_gap = self._detect_queue(locked)\n            if self.queue_type is None:\n                stale_price = True\n\n        (score, reasons, aligned_count, bullish_count,\n         bearish_count, parts) = self._calculate_score(mtf_signal, regime)\n\n        lookback = getattr(config, \"MOMENTUM_LOOKBACK\", 5)\n        if len(self.df) \u003e= lookback:\n            recent = self.df[\"last_price\"].tail(lookback)\n            if float(recent.iloc[0]) \u003e 0:\n                move_pct = (float(recent.iloc[-1]) - float(recent.iloc[0])) / float(recent.iloc[0]) * 100\n                m_th = getattr(config, \"MOMENTUM_THRESHOLD\", 0.4)\n                if abs(move_pct) \u003e m_th:\n                    score += (1 if move_pct \u003e 0 else -1) * getattr(config, \"MOMENTUM_BONUS\", 12)\n                    reasons.append(f\"Momentum Surge ({'+' if move_pct \u003e 0 else ''}{move_pct:.1f}%)\")\n\n        if self.queue_type == \"BUY\":\n            reasons.append(f\"🔥 صف خرید (+{self.queue_gap}% روی سقف)\")\n        elif self.queue_type == \"SELL\":\n            reasons.append(f\"🔻 صف فروش ({self.queue_gap}% روی کف)\")\n\n        if self.fib and self.fib.current_zone != \"MIDDLE
